name: Run Python tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      MPLBACKEND: Agg
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      ZENREG_OMIO_CACHE_DIR: /tmp/zenreg-omio-cache
      NUMBA_CACHE_DIR: /tmp/zenreg-numba-cache
      XDG_CACHE_HOME: /tmp/zenreg-xdg-cache
      MPLCONFIGDIR: /tmp/zenreg-matplotlib

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          activate-environment: zenreg
          auto-update-conda: true
          miniforge-variant: Miniforge3
          channels: conda-forge
          conda-remove-defaults: true

      - name: Install ZenReg and test dependencies
        shell: bash -l {0}
        run: |
          conda activate zenreg
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Debug ZenReg import
        shell: bash -l {0}
        run: |
          conda activate zenreg
          python -c "import zenreg; print('zenreg imported from:', zenreg.__file__); print('zenreg version:', zenreg.__version__); print('available CPUs:', zenreg.available_cpu_count())"

      - name: Run tests
        shell: bash -l {0}
        run: |
          conda activate zenreg
          pytest -p pytest_cov --cov=zenreg --cov-branch --cov-report=term --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          disable_search: true
          fail_ci_if_error: false
          files: coverage.xml
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          disable_search: true
          fail_ci_if_error: false
          files: junit.xml
          report_type: test_results
          verbose: true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zenreg"
version = "0.0.13"
description = "High-throughput, memory-efficient N-dimensional image registration."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [
  { name = "Fabrizio Musacchio" }
]
keywords = [
  "microscopy",
  "registration",
  "image-registration",
  "bioimage-analysis",
  "TZCYX"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Image Processing"
]
dependencies = [
  "scipy",
  "scikit-image",
  "SimpleITK",
  "pystackreg",
  "omio-microscopy>=0.2.8",
  "matplotlib",
  "tqdm",
  "ipykernel"
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-cov>=5",
  "ruff>=0.5"
]
docs = [
  "sphinx",
  "sphinx-autodoc-typehints",
  "sphinx-rtd-theme",
  "myst-parser",
  "sphinx-copybutton"
]

[project.urls]
Homepage = "https://github.com/fabriziomusacchio/zenreg"
Repository = "https://github.com/fabriziomusacchio/zenreg"
Issues = "https://github.com/fabriziomusacchio/zenreg/issues"

[tool.setuptools.packages.find]
include = ["zenreg*"]

[tool.ruff]
line-length = 100
target-version = "py312"
